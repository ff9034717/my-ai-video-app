<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS 2: Tactical Mobile Ops</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background: #0b0f19; color: #00ffcc; text-align: center; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; border: 2px solid #1e293b; }
        
        /* Tactical HUD Header */
        header { padding: 8px 15px; background: rgba(15, 23, 42, 0.95); width: 100%; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; border-bottom: 2px solid #334155; text-transform: uppercase; letter-spacing: 1px; }
        .hud-item { color: #38bdf8; }
        .hud-alert { color: #ef4444; }

        /* Game Arena */
        #canvas-area { position: relative; flex-grow: 1; width: 100%; overflow: hidden; background: #111827; background-image: linear-gradient(rgba(30,41,59,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(30,41,59,0.3) 1px, transparent 1px); background-size: 30px 30px; }
        
        /* Crosshair in center */
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: rgba(255, 255, 255, 0.5); pointer-events: none; }

        /* Tactical Target (Enemy) */
        .enemy-target { position: absolute; width: 45px; height: 45px; background: #ef4444; border: 2px solid #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; box-shadow: 0 0 12px #ef4444; }
        
        /* Weapon View */
        .weapon-hud { position: absolute; bottom: 5px; right: 10px; font-size: 32px; pointer-events: none; filter: drop-shadow(0 0 5px #000); }

        /* Controls Panel */
        .controls { padding: 12px; width: 100%; background: #0f172a; display: flex; justify-content: space-around; align-items: center; border-top: 2px solid #334155; }
        .tactical-btn { background: #1e293b; color: #fff; border: 1px solid #475569; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .tactical-btn:active { background: #334155; }
        .fire-btn { background: #dc2626; border-color: #ef4444; color: #fff; box-shadow: 0 0 10px rgba(220, 38, 38, 0.5); }
        .fire-btn:active { background: #b91c1c; }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <div class="hud-item">CS: 2 MOBILE</div>
            <div class="hud-item">Score: <span id="score">0</span></div>
            <div class="hud-alert">T-Side Active</div>
        </header>

        <div id="canvas-area">
            <div class="crosshair">+</div>
            <div class="enemy-target" id="enemy" style="top: 80px; left: 150px;" onclick="eliminateEnemy()">🦹‍♂️</div>
            <div class="weapon-hud">🎯</div>
        </div>

        <div class="controls">
            <button class="tactical-btn" onclick="strafeLeft()">◀ STRAFE</button>
            <button class="tactical-btn fire-btn" onclick="fireWeapon()">🔥 FIRE</button>
            <button class="tactical-btn" onclick="strafeRight()">STRAFE ▶</button>
        </div>
    </div>

    <script>
        let score = 0;

        function eliminateEnemy() {
            score += 100;
            document.getElementById('score').innerText = score;
            spawnNewEnemy();
        }

        function fireWeapon() {
            // Check if user clicked fire button directly
            score += 50;
            document.getElementById('score').innerText = score;
            spawnNewEnemy();
        }

        function spawnNewEnemy() {
            const enemy = document.getElementById('enemy');
            const maxX = window.innerWidth - 60;
            const maxY = window.innerHeight - 250;
            const randomX = Math.floor(Math.random() * (maxX - 20)) + 10;
            const randomY = Math.floor(Math.random() * (maxY - 50)) + 20;
            enemy.style.left = randomX + 'px';
            enemy.style.top = randomY + 'px';
        }

        function strafeLeft() {
            const enemy = document.getElementById('enemy');
            let currentLeft = parseInt(enemy.style.left);
            if(currentLeft > 20) {
                enemy.style.left = (currentLeft - 40) + 'px';
            }
        }

        function strafeRight() {
            const enemy = document.getElementById('enemy');
            let currentLeft = parseInt(enemy.style.left);
            if(currentLeft < window.innerWidth - 70) {
                enemy.style.left = (currentLeft + 40) + 'px';
            }
        }
    </script>

</body>
</html>
