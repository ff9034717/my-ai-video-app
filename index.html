<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Shooter Arena - Free Fire Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; text-align: center; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%); }
        header { padding: 10px; background: rgba(15, 23, 42, 0.9); width: 100%; display: flex; justify-content: space-around; font-size: 16px; font-weight: bold; border-bottom: 1px solid #334155; }
        .score-board { color: #38bdf8; }
        .health-board { color: #f43f5e; }
        
        #canvas-area { position: relative; flex-grow: 1; width: 100%; overflow: hidden; background: #111827; }
        
        /* Game Elements */
        .target { position: absolute; width: 50px; height: 50px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; box-shadow: 0 0 10px #ef4444; transition: transform 0.1s; }
        .player-gun { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 40px; }

        /* Controls */
        .controls { padding: 15px; width: 100%; background: #1e293b; display: flex; justify-content: space-around; align-items: center; }
        .action-btn { background: #0284c7; color: white; border: none; padding: 15px 25px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .action-btn:active { background: #0369a1; transform: scale(0.95); }
        .shoot-btn { background: #ef4444; }
        .shoot-btn:active { background: #dc2626; }
    </style>
</head>
<body>

    <div id="game-container">
        <header>
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="health-board">Target: Destroy Enemies!</div>
        </header>

        <div id="canvas-area">
            <div class="target" id="enemy" style="top: 50px; left: 100px;" onclick="hitEnemy()">🎯</div>
            <div class="player-gun">🔫</div>
        </div>

        <div class="controls">
            <button class="action-btn" onclick="moveLeft()">⬅️ Move</button>
            <button class="action-btn shoot-btn" onclick="shootEnemy()">🔥 FIRE</button>
            <button class="action-btn" onclick="moveRight()">Move ➡️</button>
        </div>
    </div>

    <script>
        let score = 0;
        let enemyPos = 100;

        function hitEnemy() {
            score += 10;
            document.getElementById('score').innerText = score;
            respawnEnemy();
        }

        function shootEnemy() {
            // Fire action simulation
            score += 5;
            document.getElementById('score').innerText = score;
            respawnEnemy();
        }

        function respawnEnemy() {
            const enemy = document.getElementById('enemy');
            const randomX = Math.floor(Math.random() * (window.innerWidth - 70));
            const randomY = Math.floor(Math.random() * 200) + 20;
            enemy.style.left = randomX + 'px';
            enemy.style.top = randomY + 'px';
        }

        function moveLeft() {
            const enemy = document.getElementById('enemy');
            let currentLeft = parseInt(enemy.style.left);
            if(currentLeft > 30) {
                enemy.style.left = (currentLeft - 30) + 'px';
            }
        }

        function moveRight() {
            const enemy = document.getElementById('enemy');
            let currentLeft = parseInt(enemy.style.left);
            if(currentLeft < window.innerWidth - 80) {
                enemy.style.left = (currentLeft + 30) + 'px';
            }
        }
    </script>

</body>
</html>
